domain-needed # never forward plain names (without a dot or domain part)
bogus-priv # never forward addresses in the non-routed address spaces
local=/local/ # .local belongs to mDNS, never forward it upstream
interface-name=planktoscope,wlan0
interface-name=planktoscope.local,wlan0
interface-name=raspberrypi,wlan0
interface-name=raspberrypi.local,wlan0
